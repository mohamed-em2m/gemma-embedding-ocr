[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embedding-ocr"
version = "0.1.0"
description = "Modular OCR replacing recognition with visual embedding matching"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pillow",
  "opencv-python-headless",
  "pydantic>=2",
  "pyyaml",
  "typer",
  "rich",
  "torch",
  "transformers",
  "sentence-transformers",
  "faiss-cpu>=1.8",
  "jiwer",
  "rapidfuzz",
  "pytesseract>=0.3.13",
  "easyocr>=1.7.2",
  "paddleocr>=3.7.0",
  "paddlepaddle>=3.3.0",
  "accelerate>=1.15.0",
  "qwen-vl-utils>=0.0.14",
  "datasets>=5.1.0",
]

[project.optional-dependencies]
baseline = ["paddleocr", "paddlepaddle"]
faiss-gpu = ["faiss-gpu-cu12"]

[project.scripts]
embedding-ocr = "embedding_ocr.cli:app"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pre-commit"]
notebooks = ["jupyter", "matplotlib"]

[tool.hatch.build.targets.wheel]
packages = ["src/embedding_ocr"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "PT"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: tests requiring the real EmbeddingGemma2 model (skip in CI)"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_calls = false
check_untyped_defs = true
