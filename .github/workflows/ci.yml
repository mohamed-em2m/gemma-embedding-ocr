name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.11 .venv
      - run: uv pip install --python .venv/bin/python -e . pytest pytest-cov ruff mypy
      - run: uv run --no-sync ruff check src scripts tests
      - run: uv run --no-sync ruff format --check src scripts tests
      - run: uv run --no-sync mypy src
      - run: uv run --no-sync pytest --cov
