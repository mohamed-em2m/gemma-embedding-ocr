embedder:
  backend: gemma
  dim: 768
  device: auto
  batch_size: 16

detector:
  backend: full
  rtl: true
  lang: ar

index:
  backend: faiss
  top_k: 30
  path: artifacts/prototypes/v1

recognition:
  backend: hierarchical
  script: arabic
  rtl: true
  top_k: 20
  use_alignment: true
  min_alignment_score: 0.35
  alignment:
    strategy: pruned
    max_cut_candidates: null
    min_cut_spacing: null
    max_edges_per_start: 2
    fallback_exhaustive: true
  vocabulary:
    tokenizer_name: google/embeddinggemma-2
    cache_dir: artifacts/vocab_cache_arabic
    use_visual_prototypes: true
    prototype_fonts:
      - /usr/share/fonts/google-noto-vf/NotoNaskhArabic[wght].ttf
      - /usr/share/fonts/google-noto-vf/NotoSansArabic[wght].ttf
      - /usr/share/fonts/vazirmatn-vf-fonts/Vazirmatn[wght].ttf
    slant_angles: [0.0]
    max_words: 25000
    max_subwords: 15000
    extra_lexicon: []

pipeline:
  preprocess: false
  detection_cache: artifacts/cache/detections
  seed: 42
