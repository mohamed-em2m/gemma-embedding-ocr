embedder:
  backend: gemma
  dim: 768
  device: auto

detector:
  backend: paddle
  rtl: null
  device: auto
  lang: en
  paddle_model: PP-OCRv5_server_det
  min_confidence: 0.3
  box_padding: 2

index:
  backend: faiss_ivf_sq8
  nlist: 1024
  nprobe: 16
  quantizer_bits: 8
  train_size: null
  top_k: 30
  path: artifacts/prototypes/v1

recognition:
  backend: paddle
  script: latin
  paddle_model: en_PP-OCRv4_mobile_rec

pipeline:
  preprocess: false
  detection_cache: artifacts/cache/detections
  seed: 42
