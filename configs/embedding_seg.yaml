embedder:
  backend: gemma
  dim: 768
  device: auto
  batch_size: 0

detector:
  backend: auto
  rtl: null
  device: auto
  lang: en
  paddle_model: PP-OCRv5_server_det
  min_confidence: 0.3
  box_padding: 2

index:
  backend: faiss_ivf_sq8
  nlist: 1024
  nprobe: 16
  quantizer_bits: 8
  train_size: null
  top_k: 30
  path: artifacts/prototypes/clean_alnum_768d

recognition:
  backend: embedding
  script: latin
  rtl: null
  top_k: 25

pipeline:
  preprocess: true
  deslant: true
  binarize: true
  detection_cache: artifacts/cache/detections
  seed: 42
